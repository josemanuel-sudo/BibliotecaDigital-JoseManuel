name: Deploy - GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar sitio web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Comprobar archivos del sitio
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js

          echo "Todos los archivos del sitio están disponibles."

      - name: Mostrar contenido que se publicará
        run: |
          echo "Archivos del portal:"
          find site -maxdepth 2 -type f

      - name: Subir archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar sitio web
        id: deployment
        uses: actions/deploy-pages@v4
